name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Actions are pinned to the commit of a release (version in the comment), as in release.yml;
# Dependabot proposes updates. Tool versions come from .tool-versions, as they do locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # tool-versions is the Node in .tool-versions; 22.23.x is the engines floor on the 22 line.
    name: ${{ matrix.node == 'tool-versions' && format('test ({0})', matrix.os) || format('test ({0}, Node {1})', matrix.os, matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ tool-versions, 22.23.x ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: |
          echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == 'tool-versions' && steps.tools.outputs.node || matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting and types don't depend on the OS or the Node version: once is enough.
      - name: Check formatting and lint
        if: runner.os == 'Linux' && matrix.node == 'tool-versions'
        run: pnpm run format-and-lint
      - name: Check TypeScript
        if: runner.os == 'Linux' && matrix.node == 'tool-versions'
        run: pnpm run check-types
      - name: Run tests
        run: pnpm test
      - name: Build project
        run: pnpm run build
      # The unit tests run through swc; only the built bundle proves it starts on this
      # Node. commander is inlined, and @inquirer/prompts loads with import() in update -i.
      - name: The built CLI starts
        shell: bash
        run: |
          test "$(node dist/index.cjs --version)" = "$(node -p "require('./package.json').version")"
          node dist/index.cjs help

  integration:
    # Real package managers against temp copies of testRepos/. One job per manager, so each
    # installs only its own. setup-node caches the pnpm store, which then holds only this
    # repo's own install: the suite's pnpm installs use a store in a temp directory
    # (pnpm_config_store_dir), and no manager's cache for testRepos is saved, so each run
    # resolves from the registry like a fresh machine.
    # cli is what the matrix runs: the Node bundle (dist/index.cjs), or the compiled Bun
    # binary of this runner's OS (#266: pnpm run build:binary --target host, extracted, and
    # named by AUTD_INTEGRATION_CLI). The binary also runs on macOS, which the bundle does not.
    name: integration (${{ matrix.os }}, ${{ matrix.pm }}, ${{ matrix.cli }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        pm: [ npm, pnpm, yarn, berry, bun ]
        cli: [ bundle, binary ]
        include:
          - { os: macos-latest, pm: npm, cli: binary }
          - { os: macos-latest, pm: pnpm, cli: binary }
          - { os: macos-latest, pm: yarn, cli: binary }
          - { os: macos-latest, pm: berry, cli: binary }
          - { os: macos-latest, pm: bun, cli: binary }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AUTD_INTEGRATION_PM: ${{ matrix.pm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # yarn 1.22.22 / 4.18.1 come from each testRepo's packageManager, through Corepack.
      # Only yarn's shims, so pnpm stays the version set up above.
      - name: Enable yarn through Corepack
        if: matrix.pm == 'yarn' || matrix.pm == 'berry'
        run: corepack enable yarn
      # The binary build compiles with Bun, so every binary job needs it, not only bun's.
      - name: Set up Bun
        if: matrix.pm == 'bun' || matrix.cli == 'binary'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Show tool versions
        shell: bash
        run: |
          node --version; npm --version; pnpm --version
          if [ "$AUTD_INTEGRATION_PM" = bun ]; then bun --version; fi
      - run: pnpm install --frozen-lockfile
      - name: Build the host binary
        if: matrix.cli == 'binary'
        run: |
          pnpm run build
          pnpm run build:binary --target host
      - name: Extract the binary
        if: matrix.cli == 'binary' && runner.os != 'Windows'
        run: |
          dest="$RUNNER_TEMP/autd-binary"
          mkdir -p "$dest"
          tar -xzf dist-binary/*.tar.gz -C "$dest"
          "$dest/autd" --version
          echo "AUTD_INTEGRATION_CLI=$dest/autd" >> "$GITHUB_ENV"
      - name: Extract the binary
        if: matrix.cli == 'binary' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'autd-binary'
          Expand-Archive -Path (Get-ChildItem dist-binary -Filter *.zip).FullName -DestinationPath $dest
          & "$dest\autd.exe" --version
          "AUTD_INTEGRATION_CLI=$dest\autd.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the integration matrix
        run: pnpm run test:integration
      - name: The suite leaves the checkout untouched
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  binary-without-node:
    # The compiled binary needs no Node (#266, M5's Done when): check and update on a bun
    # project, then bun's frozen install, with a PATH that holds bun and the system
    # directories and no node. Building needs Node, so the binary is built first, in the
    # same job, and only the run is restricted.
    name: binary without Node (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - name: Build the host binary
        run: |
          pnpm run build
          pnpm run build:binary --target host
      - name: Extract the binary
        run: |
          mkdir -p "$RUNNER_TEMP/autd-binary"
          tar -xzf dist-binary/*.tar.gz -C "$RUNNER_TEMP/autd-binary"
      - name: Run check and update with no Node on PATH
        env:
          AUTD_BIN: ${{ runner.temp }}/autd-binary/autd
          WORK: ${{ runner.temp }}/bun-single
        run: |
          cp -R testRepos/bun-single "$WORK"
          mv "$WORK/package.fixture.json" "$WORK/package.json"
          # A plain bun install takes every range to its newest version, so nothing moves
          # within the ranges; "minor" lets dayjs (an exact pin) and debug (~4.3.1) move past
          # theirs, which update writes and bun's frozen install must then accept.
          echo '{ "beyondRange": "minor" }' > "$WORK/.always-up-to-date.json"
          # bun's directory and the system's: the runner's Node lives in neither.
          safe_path="$(dirname "$(command -v bun)"):/usr/bin:/bin"
          env PATH="$safe_path" bash -euo pipefail -c '
            for name in node nodejs; do
              if command -v "$name"; then echo "$name is on PATH" >&2; exit 1; fi
            done
            command -v bun
            cd "$WORK"
            bun install
            "$AUTD_BIN" check --json > check.json
            "$AUTD_BIN" update --json > update.json
            bun install --frozen-lockfile
            jq -e ".version == 1 and .command == \"check\" and .phase == \"plan\" and .manager == \"bun\" and ([.rows[] | select(.outcome == \"update\")] | length) > 0" check.json
            jq -e ".version == 1 and .command == \"update\" and .phase == \"applied\" and .manager == \"bun\" and ([.rows[] | select(.outcome == \"update\")] | length) > 0" update.json
          '

  homebrew-formula:
    # The release's formula, installed by a real Homebrew before any release (#268): Homebrew may
    # rewrite an installed executable (relinking and re-signing on macOS, patchelf on Linux), which
    # could break a compiled Bun binary's appended payload. The formula is rendered from the
    # archives this job builds, through render.sh's file:// base URL, into a local tap, and then
    # `brew install`, `brew test` and the three command names run on it.
    name: homebrew-formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Homebrew stays in its JSON-API mode: HOMEBREW_NO_INSTALL_FROM_API would make the install
    # git-clone homebrew/core, which the Linux runner can't create (Permission denied).
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Lint the render script
        if: runner.os == 'Linux'
        run: shellcheck packaging/homebrew/render.sh
      - run: pnpm install --frozen-lockfile
      # All five targets, so render.sh finds the four tarballs; the darwin pair is only re-signed
      # on macOS.
      - name: Build the binaries
        run: |
          pnpm run build
          pnpm run build:binary
      - name: Put Homebrew on PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Render the formula into a local tap
        run: |
          eval "$(brew shellenv)"
          version=$(node -p "require('./package.json').version")
          brew tap-new --no-git local/autd
          packaging/homebrew/render.sh "$version" dist-binary/SHA256SUMS \
            "$RUNNER_TEMP/tap" "file://$PWD/dist-binary"
          cp "$RUNNER_TEMP/tap/Formula/always-up-to-date.rb" \
            "$(brew --repository)/Library/Taps/local/homebrew-autd/Formula/"
      - name: Install and test the formula
        run: |
          eval "$(brew shellenv)"
          brew install local/autd/always-up-to-date
          brew test local/autd/always-up-to-date
      - name: Run each command name and check a bun project
        env:
          WORK: ${{ runner.temp }}/bun-single
        run: |
          eval "$(brew shellenv)"
          version=$(node -p "require('./package.json').version")
          for name in autd alwaysuptodate always-up-to-date; do
            actual=$("$(brew --prefix)/bin/$name" --version)
            if [ "$actual" != "$version" ]; then
              echo "::error::$name --version printed '$actual', not $version."
              exit 1
            fi
          done
          cp -R testRepos/bun-single "$WORK"
          mv "$WORK/package.fixture.json" "$WORK/package.json"
          cd "$WORK"
          bun install
          autd check --json > check.json
          grep -q '"command": "check"' check.json
          grep -q '"manager": "bun"' check.json

  perf:
    # The performance budgets (pnpm run bench:gate, bench/budgets.ts) on a real runner: one job
    # per manager, plus startup, which needs no manager and is measured once. Each leg writes
    # its result to the job summary, and a budget confirmed over (or a measurement that failed or
    # was throttled) fails the leg.
    # hyperfine 2 is not in apt (Ubuntu has 1.18), so it comes from the release tarball,
    # checked against a digest. Dependabot cannot update that pin: bump HYPERFINE_VERSION and
    # HYPERFINE_SHA256 together by hand (the digest is on the release page's asset).
    name: perf (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [ startup, npm, pnpm, yarn, berry, berry-nm, bun ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTD_BENCH_GATE_TARGET: ${{ matrix.target }}
      HYPERFINE_VERSION: 2.0.0
      HYPERFINE_SHA256: 38e59087bd65520930a13cf513d8a493b7043741e8ad62349a8a9929eb61bc5c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Set up Bun
        if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install hyperfine
        shell: bash
        run: |
          asset="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$asset" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/$asset"
          echo "$HYPERFINE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hyperfine"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/hyperfine"
          echo "$RUNNER_TEMP/hyperfine" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Measure against the budgets
        run: pnpm run bench:gate
      - name: The bench leaves the checkout untouched
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
