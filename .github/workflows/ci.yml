name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Actions are pinned to the commit of a release (version in the comment), as in release.yml;
# Dependabot proposes updates. Tool versions come from .tool-versions, as they do locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # tool-versions is the Node in .tool-versions; 22.23.x is the engines floor on the 22 line.
    name: ${{ matrix.node == 'tool-versions' && format('test ({0})', matrix.os) || format('test ({0}, Node {1})', matrix.os, matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ tool-versions, 22.23.x ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: |
          echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == 'tool-versions' && steps.tools.outputs.node || matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting and types don't depend on the OS or the Node version: once is enough.
      - name: Check formatting and lint
        if: runner.os == 'Linux' && matrix.node == 'tool-versions'
        run: pnpm run format-and-lint
      - name: Check TypeScript
        if: runner.os == 'Linux' && matrix.node == 'tool-versions'
        run: pnpm run check-types
      - name: Run tests
        run: pnpm test
      - name: Build project
        run: pnpm run build
      # The unit tests run through swc; only the built bundle proves it starts on this
      # Node. commander is inlined, and @inquirer/prompts loads with import() in update -i.
      - name: The built CLI starts
        shell: bash
        run: |
          test "$(node dist/index.js --version)" = "$(node -p "require('./package.json').version")"
          node dist/index.js help

  integration:
    # Real package managers against temp copies of testRepos/. One job per manager, so each
    # installs only its own. setup-node caches the pnpm store, which then holds only this
    # repo's own install: the suite's pnpm installs use a store in a temp directory
    # (pnpm_config_store_dir), and no manager's cache for testRepos is saved, so each run
    # resolves from the registry like a fresh machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        pm: [ npm, pnpm, yarn, berry, bun ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AUTD_INTEGRATION_PM: ${{ matrix.pm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # yarn 1.22.22 / 4.12.0 come from each testRepo's packageManager, through Corepack.
      # Only yarn's shims, so pnpm stays the version set up above.
      - name: Enable yarn through Corepack
        if: matrix.pm == 'yarn' || matrix.pm == 'berry'
        run: corepack enable yarn
      - name: Set up Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Show tool versions
        shell: bash
        run: |
          node --version; npm --version; pnpm --version
          if [ "$AUTD_INTEGRATION_PM" = bun ]; then bun --version; fi
      - run: pnpm install --frozen-lockfile
      - name: Run the integration matrix
        run: pnpm run test:integration
      - name: The suite leaves the checkout untouched
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  perf:
    # The performance budgets (pnpm run bench:gate, bench/budgets.ts) on a real runner: one job
    # per manager, plus startup, which needs no manager and is measured once. Each leg writes
    # its result to the job summary. For now the measure step is report-only
    # (continue-on-error), so a red result does not fail the run; the enforcement phase removes it.
    # hyperfine 2 is not in apt (Ubuntu has 1.18), so it comes from the release tarball,
    # checked against a digest. Dependabot cannot update that pin: bump HYPERFINE_VERSION and
    # HYPERFINE_SHA256 together by hand (the digest is on the release page's asset).
    name: perf (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [ startup, npm, pnpm, yarn, berry, berry-nm, bun ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTD_BENCH_GATE_TARGET: ${{ matrix.target }}
      HYPERFINE_VERSION: 2.0.0
      HYPERFINE_SHA256: 38e59087bd65520930a13cf513d8a493b7043741e8ad62349a8a9929eb61bc5c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        shell: bash
        run: echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Set up Bun
        if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install hyperfine
        shell: bash
        run: |
          asset="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$asset" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/$asset"
          echo "$HYPERFINE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hyperfine"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/hyperfine"
          echo "$RUNNER_TEMP/hyperfine" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Measure against the budgets
        # Report-only for now: the summary tells the truth while the job stays green.
        # The enforcement phase of the perf-gates work removes this line.
        continue-on-error: true
        run: pnpm run bench:gate
      - name: The bench leaves the checkout untouched
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
