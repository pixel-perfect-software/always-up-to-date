version: 2
updates:
  # Monitor the root package.json for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Halifax"
    exclude-paths:
      - "testRepos/**"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group production dependencies together
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "*eslint*"
          - "jest*"
          - "prettier"
          - "typescript*"
          - "ts-*"
      # Group development dependencies together
      development-dependencies:
        patterns:
          - "@types/*"
          - "*eslint*"
          - "jest*"
          - "prettier"
          - "typescript*"
          - "ts-*"

  # Keeps the workflows' pinned actions current: Dependabot updates each commit SHA and the
  # version comment beside it together, in one grouped pull request a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # pnpm/action-setup's floating v6 tag still points at v6.0.10, and #86 followed it, moving
      # release.yml back from v6.1.0 (the release that supports pnpm 12) to v6.0.10.
      - dependency-name: "pnpm/action-setup"
        versions: ["< 6.1.0"]
    labels:
      - "dependencies"
      - "automated"
    groups:
      actions:
        patterns:
          - "*"
